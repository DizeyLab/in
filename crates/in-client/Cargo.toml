[package]
name = "in-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Drop-in OIDC client for topcoat apps authenticating against im"

[dependencies]
topcoat = { version = "0.8.0", default-features = false, features = [
  "router",
  "cookie",
] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
subtle.workspace = true
chacha20poly1305.workspace = true
# rsa 0.10 verifies through the digest 0.11 traits, so its hasher is the
# workspace sha2 0.11 that PKCE already uses.
rsa = "0.10.0-rc.18"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "json",
  "form",
] }


[features]
test-seam = []

[dev-dependencies]
topcoat = { version = "0.8.0", default-features = false, features = [
  "router",
  "cookie",
  "view",
  "serve",
  "discover",
] }
http = "1.5"
# Tests generate their own RSA keys, and rsa 0.10's RNG is the rand_core 0.10
# line that the workspace rand 0.10 provides.
rand_core010 = { package = "rand_core", version = "0.10.1" }

[[example]]
name = "mint"
required-features = ["test-seam"]
