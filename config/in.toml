# Where the one database file lives. One process holds it.
database = "in.db"
# The address the server listens on. Environment variables are ignored —
# this is the only thing that decides where In binds.
listen = "127.0.0.1:7655"
# How long a live-update connection is held before the browser is asked to
# reconnect, in seconds. The reconnect is what re-checks the session, so a
# revoked sign-in stops receiving within this long.
live_seconds = 300
# How many days a trashed file or folder waits before the boot sweep purges
# it for good. Trash counts toward quota until then.
purge_after_days = 30
# The quota a newly provisioned account starts on, in bytes. 10 GiB.
default_quota_bytes = 10737418240
# The base of the share links In hands out. Set it when In answers on a
# different address than it binds — a domain, or a proxy in front. Left
# empty, links follow the listen address.
base_url = ""
# Where drive files, thumbnails and staged upload chunks live as files,
# created on boot. Not written here: it defaults to beside the database file,
# and the boot completes this file with the value it resolved.

# The suite the switcher's wordmarks link to is im's to keep — im's admin
# panel owns the list, and In fetches it from im and keeps a mirror. This
# file no longer names the suite; a `[[services]]` block left behind by an
# older file is reported as ignored and then passed over.
# Where drive files, thumbnails and staged upload chunks live as files, created on boot.
storage = "/home/tahinli/Documents/Code/Rust/in/storage"

[oidc]
# The provider that signs people in. Required: no default is guessed.
issuer = "http://127.0.0.1:7650"
# The client id In presents to the provider. Required.
client_id = "in-dev-capture"
# The client secret In presents to the provider. Required. Filled in only on
# the machine that runs the server — the committed copy stays empty.
client_secret = "in-dev-secret"
# Where the provider sends the browser back after sign-in. Not written here:
# it defaults from `listen` on every boot, so moving the address never leaves
# a stale callback behind. Set it only when the public address differs from
# the bind address (a proxy in front, for instance).
# redirect_uri = "http://127.0.0.1:7655/auth/callback"

# Where the file bytes themselves live. With no [storage.r2] table, the
# bytes stay on local disk in the `storage` tree (files/ and thumbs/ beside
# the database) — the default, and the only shape every other key here
# describes.
#
# Setting [storage.r2] moves the file and thumbnail bytes into a Cloudflare
# R2 bucket. The database keeps every row, quota and piece of metadata —
# only the bytes move. `storage` still names the local tree either way:
# upload chunks stage there, then stream up to the bucket.
#
# [storage.r2]
# account_id — the R2 account id; the endpoint becomes
#   https://<account_id>.r2.cloudflarestorage.com
# bucket — the bucket the blobs land in, under files/ and thumbs/ — the same
#   layout the local tree uses, so an rclone maps one onto the other.
# key_file — a path (resolved against this config directory) to a file with
#   two lines: the R2 access key id on the first, the secret on the second.
#   Create it readable only by the user the server runs as (0600); it is
#   read once at boot and never logged:
#     (umask 077 && printf '%s\n%s\n' '<access key id>' '<secret>' > config/r2.keys)
#
# Absence is meaningful: no table, no bucket, local bytes. Nothing here is
# ever completed into the file for you.
#
# Migrating an existing deployment's bytes into the bucket — database and
# storage tree stay where they are; run once with the server stopped:
#   rclone copy <storage>/files :r2,account=<id>,key=<id>:<bucket>/files
#   rclone copy <storage>/thumbs :r2,account=<id>,key=<id>:<bucket>/thumbs
